# Jalankan dari root repository:
#   docker compose up -d --build
#
# Variabel runtime diambil dari `.env` (root repo) lewat `env_file:`.
# Aplikasi ini tidak punya build arg, jadi tidak perlu `--env-file`.

services:
  redis:
    image: redis:7-alpine
    container_name: tte_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tte-eseal-app:latest
    container_name: tte_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # REDIS_URL dipaksa ke service internal, menimpa nilai dari .env.
      REDIS_URL: redis://redis:6379
    ports:
      # Diekspos ke semua interface; diakses langsung lewat IP server.
      - "3030:3000"
    depends_on:
      redis:
        condition: service_healthy
    # BullMQ worker memproses job panjang (BSrE); beri waktu drain saat SIGTERM.
    stop_grace_period: 30s
    healthcheck:
      # /health publik, tidak menyentuh DB. Image alpine punya wget (busybox).
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tte-eseal-app:latest
    container_name: tte_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Dijalankan manual, bukan ikut `up`:
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: tte-eseal-migrate:latest
    env_file:
      - .env

volumes:
  redis-data:
