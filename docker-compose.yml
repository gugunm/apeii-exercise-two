name: tte-eseal

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: tte-eseal-migrate:latest
    profiles: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tte-eseal-app:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      REDIS_URL: redis://redis:6379
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BSRE_BASE_URL: ${BSRE_BASE_URL}
      BSRE_USERNAME: ${BSRE_USERNAME}
      BSRE_PASSWORD: ${BSRE_PASSWORD}
      BSRE_ID_SUBSCRIBER: ${BSRE_ID_SUBSCRIBER}
      BSRE_SEAL_IMAGE_KEY: ${BSRE_SEAL_IMAGE_KEY}
      ESEAL_MAX_FILES: ${ESEAL_MAX_FILES}
      ESEAL_MAX_FILE_BYTES: ${ESEAL_MAX_FILE_BYTES}
      ESEAL_SIGNED_URL_TTL: ${ESEAL_SIGNED_URL_TTL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "3030:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tte-eseal-app:latest
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      REDIS_URL: redis://redis:6379
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BSRE_BASE_URL: ${BSRE_BASE_URL}
      BSRE_USERNAME: ${BSRE_USERNAME}
      BSRE_PASSWORD: ${BSRE_PASSWORD}
      BSRE_ID_SUBSCRIBER: ${BSRE_ID_SUBSCRIBER}
      BSRE_SEAL_IMAGE_KEY: ${BSRE_SEAL_IMAGE_KEY}
      ESEAL_MAX_FILES: ${ESEAL_MAX_FILES}
      ESEAL_MAX_FILE_BYTES: ${ESEAL_MAX_FILE_BYTES}
      ESEAL_SIGNED_URL_TTL: ${ESEAL_SIGNED_URL_TTL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
